server:
  port: 8081

spring:
  application:
    name: mcsv-car
  datasource:
    url: jdbc:postgresql://localhost:5432/DDP_Microservice_Car
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      jpa:
        hibernate:
          ddl-auto: update
          dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        properties:
          hibernate:
            format_sql: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true